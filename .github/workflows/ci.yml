# Build, format check, unit tests, the release zip, and the Store package for every push or pull request to main.
# Docs-only changes are skipped. Integration tests need a real Flutter device and stay skipped here.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StatefulBar.sln

      - name: Format check
        run: dotnet format StatefulBar.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build StatefulBar.sln -c Release --no-restore

      - name: Test
        run: dotnet test StatefulBar.sln -c Release --no-build

      - name: Publish release zip and Store package
        shell: pwsh
        run: ./tools/publish.ps1 -Msix

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: StatefulBar-win-x64
          path: artifacts/StatefulBar-*-win-x64.zip
          retention-days: 7
          if-no-files-found: error

      # Unsigned on purpose (the Store signs it): for the Partner Center upload, not for installing by hand.
      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: StatefulBar-msix
          path: artifacts/StatefulBar-*-win-x64.msix
          retention-days: 7
          if-no-files-found: error
